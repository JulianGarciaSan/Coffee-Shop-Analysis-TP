  chaos_monkey:
    build:
      context: ./server/chaos_monkey
      dockerfile: Dockerfile
    container_name: chaos_monkey
    restart: "no"  # No reiniciar automáticamente
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PYTHONUNBUFFERED=1
      - KILL_INTERVAL=1  # Segundos entre caídas
    depends_on:
      gateway:
        condition: service_started
      filter_year_1:
        condition: service_started
      filter_year_2:
        condition: service_started  
      filter_year_3:
        condition: service_started
      filter_hour_1:
        condition: service_started
      filter_hour_2:
        condition: service_started 
      filter_hour_3:
        condition: service_started
      filter_amount_1:
        condition: service_started
      filter_amount_2:
        condition: service_started
      filter_amount_3:
        condition: service_started 
      client_1:
        condition: service_started
