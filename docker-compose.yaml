services:
  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    # networks:
    #   - coffee_network

  watchdog:
    build:
      context: .
      dockerfile: ./server/watchdog/Dockerfile
    container_name: watchdog
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOST_IP=host.docker.internal
      - PYTHONUNBUFFERED=1
      - CHECK_INTERVAL=10
      - MAX_FAILURES=3
      - RESTART_GRACE_PERIOD=10
      - RESTART_CHECK_INTERVAL=5
      - STARTUP_DELAY=20
      - PING_TIMEOUT=5.0
      - MONITORED_NODES=filter_year_1,filter_year_2,filter_year_3,filter_hour_1,filter_hour_2,filter_hour_3,filter_amount_1,filter_amount_2,filter_amount_3,groupby_top_customers, groupby_semester_1,groupby_semester_2,groupby_best_selling_2025_3,groupby_best_selling_2025_2,groupby_best_selling_2025_1,groupby_best_selling_2025_0,groupby_best_selling_2024_3,groupby_best_selling_2024_2,groupby_best_selling_2024_1,groupby_best_selling_2024_0, top_consumers_aggregator_1,top_consumers_aggregator_2,aggregator_best_selling_final,dedup_q1,join_node_0,join_node_1
    depends_on:
      gateway:
        condition: service_started

  client_1:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
      - CLIENT_ID=client_1
    depends_on:
      gateway:
        condition: service_started
    volumes:
      - ./client/config.ini:/config.ini
      - ./data/transaction_items:/data/transaction_items
      - ./data/users:/data/users
      - ./data/stores:/data/stores
      - ./data/menu_items:/data/menu_items
      - ./data/payment_methods:/data/payment_methods
      - ./data/vouchers:/data/vouchers
      - ./data/transactions:/data/transactions
      - ./data/transactions_test:/data/transactions_test
      - ./report_client_1:/app/report_client_1
      - ./data/transactions_items_test:/data/transactions_items_test

  client_2:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
      - CLIENT_ID=client_2
    depends_on:
      gateway:
        condition: service_started
    volumes:
      - ./client/config.ini:/config.ini
      - ./data/transaction_items:/data/transaction_items
      - ./data/users:/data/users
      - ./data/stores:/data/stores
      - ./data/menu_items:/data/menu_items
      - ./data/payment_methods:/data/payment_methods
      - ./data/vouchers:/data/vouchers
      - ./data/transactions:/data/transactions
      - ./data/transactions_test:/data/transactions_test
      - ./report_client_2:/app/report_client_2
      - ./data/transactions_items_test:/data/transactions_items_test
  
  client_3:
